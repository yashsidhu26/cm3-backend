<!DOCTYPE html>
<html>
<head>
  <title>Test Isolated Streaming Server (Authenticated)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }

    .section {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }

    .input-group {
      margin: 15px 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #9cdcfe;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: 'Consolas', monospace;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      padding: 12px 24px;
      margin: 5px;
      background: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:hover {
      background: #1177bb;
    }

    button:disabled {
      background: #3c3c3c;
      cursor: not-allowed;
    }

    #output {
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .event {
      margin: 8px 0;
      padding: 8px;
      border-radius: 4px;
      border-left: 3px solid #555;
    }

    .event-status {
      border-left-color: #4ec9b0;
      background: rgba(78, 201, 176, 0.1);
    }

    .event-tool {
      border-left-color: #dcdcaa;
      background: rgba(220, 220, 170, 0.1);
    }

    .event-thinking {
      border-left-color: #c586c0;
      background: rgba(197, 134, 192, 0.1);
    }

    .event-chunk {
      border-left-color: #569cd6;
      background: rgba(86, 156, 214, 0.1);
    }

    .event-complete {
      border-left-color: #6a9955;
      background: rgba(106, 153, 85, 0.1);
    }

    .event-error {
      border-left-color: #f48771;
      background: rgba(244, 135, 113, 0.1);
    }

    .timestamp {
      color: #858585;
      font-size: 11px;
    }

    .analysis {
      margin-top: 20px;
      padding: 15px;
      background: #2d2d30;
      border-radius: 4px;
      border: 1px solid #3c3c3c;
    }

    .success {
      color: #6a9955;
      font-weight: bold;
    }

    .error {
      color: #f48771;
      font-weight: bold;
    }

    .info {
      color: #9cdcfe;
    }
  </style>
</head>
<body>
  <h1>🎯 Test Isolated Streaming Server</h1>
  <p>Direct connection to <code>http://localhost:4444/stream</code> with authentication</p>

  <div class="section">
    <h3>Step 1: Session Cookie</h3>
    <p class="success">✅ Using pre-configured session cookie</p>
    <p style="font-size: 12px; color: #858585; word-break: break-all;">
      super-app.session_token=Sp93jLZSjmeEvbqW67XsqEm-w08-7MRlBPYNkpjjweI...
    </p>
  </div>

  <div class="section">
    <h3>Step 2: Test Streaming</h3>
    <div class="input-group">
      <label>Query:</label>
      <textarea id="query">What courses am I enrolled in?</textarea>
    </div>
    <button onclick="testStream()" id="streamBtn">Test Streaming</button>
    <button onclick="clearOutput()">Clear Output</button>
  </div>

  <div class="section">
    <h3>Output</h3>
    <div id="output"></div>
    <div id="analysis"></div>
  </div>

  <script>
    // Set the session cookie
    const sessionCookie = 'super-app.session_token=Sp93jLZSjmeEvbqW67XsqEm-w08-7MRlBPYNkpjjweI.WvNB2ldgA9T9QT6pygJ5lZ6oqXNVQSTqeZbrn%2B2f%2B4k%3D';
    document.cookie = sessionCookie + '; path=/; SameSite=Lax';

    const timestamps = [];
    let chunkCount = 0;

    async function testStream() {
      const query = document.getElementById('query').value;
      const output = document.getElementById('output');
      const analysis = document.getElementById('analysis');

      output.innerHTML = '<p class="info">Connecting to streaming server...</p>';
      analysis.innerHTML = '';
      timestamps.length = 0;
      chunkCount = 0;

      const startTime = Date.now();
      let fullText = '';

      try {
        const response = await fetch('http://localhost:4444/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include', // Send session cookie
          body: JSON.stringify({
            query,
            format: 'text',
          }),
        });

        if (!response.ok) {
          const error = await response.text();
          output.innerHTML += `<div class="event event-error">❌ Error: ${error}</div>`;
          return;
        }

        output.innerHTML = '<p class="success">✅ Connected! Receiving events:</p>';

        // Read SSE stream
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();

          if (done) {
            output.innerHTML += '<p class="success">✅ Stream complete</p>';
            analyzeResults(startTime, fullText);
            break;
          }

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\\n');
          buffer = lines.pop() || '';

          let currentEvent = '';
          for (const line of lines) {
            if (line.startsWith('event:')) {
              currentEvent = line.substring(6).trim();
            } else if (line.startsWith('data:')) {
              const dataStr = line.substring(5).trim();
              if (!dataStr) continue;

              try {
                const data = JSON.parse(dataStr);
                const now = Date.now();
                const elapsed = now - startTime;

                if (currentEvent === 'chunk') {
                  chunkCount++;
                  timestamps.push(now);
                  fullText += data.text;
                  const preview = data.text.substring(0, 80).replace(/\\n/g, ' ');
                  output.innerHTML += `<div class="event event-chunk">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    📝 Chunk #${chunkCount}: ${preview}${data.text.length > 80 ? '...' : ''}
                  </div>`;
                } else if (currentEvent === 'status') {
                  output.innerHTML += `<div class="event event-status">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    📊 ${data.message || data.status}
                  </div>`;
                } else if (currentEvent === 'tool') {
                  output.innerHTML += `<div class="event event-tool">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    🔧 Tool: ${data.tool} - ${data.message || ''}
                  </div>`;
                } else if (currentEvent === 'thinking') {
                  output.innerHTML += `<div class="event event-thinking">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    💭 ${data.message || 'Processing...'}
                  </div>`;
                } else if (currentEvent === 'complete') {
                  output.innerHTML += `<div class="event event-complete">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    ✅ Complete - Iterations: ${data.iterations}, Tools: ${data.toolsUsed?.length || 0}
                  </div>`;
                } else if (currentEvent === 'error') {
                  output.innerHTML += `<div class="event event-error">
                    <span class="timestamp">[+${elapsed}ms]</span>
                    ❌ Error: ${data.error}
                  </div>`;
                }

                // Auto-scroll to bottom
                output.scrollTop = output.scrollHeight;

              } catch (e) {
                // Ignore parse errors
              }
            }
          }
        }

      } catch (error) {
        output.innerHTML += `<div class="event event-error">❌ Stream error: ${error.message}</div>`;
      }
    }

    function analyzeResults(startTime, fullText) {
      const totalTime = Date.now() - startTime;
      const analysis = document.getElementById('analysis');

      let html = '<div class="analysis">';
      html += '<h4>📊 Analysis</h4>';
      html += `<p>⏱️ Total time: <span class="info">${totalTime}ms</span></p>`;
      html += `<p>📦 Chunks received: <span class="info">${chunkCount}</span></p>`;
      html += `<p>📏 Text length: <span class="info">${fullText.length} characters</span></p>`;

      if (timestamps.length > 1) {
        const intervals = timestamps.slice(1).map((t, i) => t - timestamps[i]);
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const maxInterval = Math.max(...intervals);
        const minInterval = Math.min(...intervals);

        html += `<p>⏱️ Chunk intervals:</p>`;
        html += `<ul>`;
        html += `<li>Average: <span class="info">${avgInterval.toFixed(0)}ms</span></li>`;
        html += `<li>Min: <span class="info">${minInterval}ms</span></li>`;
        html += `<li>Max: <span class="info">${maxInterval}ms</span></li>`;
        html += `</ul>`;

        if (maxInterval > 50) {
          html += `<p class="success">✅ REAL-TIME STREAMING! Chunks arrived incrementally.</p>`;
        } else {
          html += `<p class="error">❌ BUFFERED! All chunks arrived within ${maxInterval}ms.</p>`;
        }
      }

      html += '<h4>📄 Full Response:</h4>';
      html += `<div style="background: #1e1e1e; padding: 10px; border-radius: 4px; white-space: pre-wrap;">${fullText || '(no text received)'}</div>`;
      html += '</div>';

      analysis.innerHTML = html;
    }

    function clearOutput() {
      document.getElementById('output').innerHTML = '';
      document.getElementById('analysis').innerHTML = '';
      timestamps.length = 0;
      chunkCount = 0;
    }
  </script>
</body>
</html>
